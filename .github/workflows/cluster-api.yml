name: Cluster API provider
on:
  pull_request:
    paths:
      - 'providers/cluster-api/**'
      - 'internal/**'
      - 'cmd/gomi/**'
      - 'bootenv/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/cluster-api.yml'
  push:
    paths:
      - 'providers/cluster-api/**'
      - 'internal/**'
      - 'cmd/gomi/**'
      - 'bootenv/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/cluster-api.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            providers/cluster-api/go.sum
            providers/cluster-api/test/integration/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Boot environment crypto and seed tests
        run: |
          python -m venv "$RUNNER_TEMP/gomi-bootstrap-tests"
          "$RUNNER_TEMP/gomi-bootstrap-tests/bin/pip" install -r bootenv/tests/requirements.txt
          "$RUNNER_TEMP/gomi-bootstrap-tests/bin/python" -m unittest discover -s bootenv/tests -v
          echo "GOMI_BOOTSTRAP_TEST_PYTHON=$RUNNER_TEMP/gomi-bootstrap-tests/bin/python" >> "$GITHUB_ENV"
      - name: Generate and verify CRDs
        working-directory: providers/cluster-api
        run: |
          make generate
          git diff --exit-code -- api config/crd
      - name: Unit, race, vet and build
        working-directory: providers/cluster-api
        run: make test build manifests
      - name: GOMI protected seed and deployment regressions
        run: go test -race ./cmd/gomi ./internal/baremetal ./internal/machine ./internal/cloudinit ./internal/infra/api ./internal/infra/pxehttp ./internal/infra/sql ./internal/infra/memory ./internal/vm
      - name: Real Kubernetes and GOMI API integration
        working-directory: providers/cluster-api
        run: make integration
      - name: Container build
        working-directory: providers/cluster-api
        run: make docker-build
      - name: Package provider release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: providers/cluster-api
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image="docker.io/library/capgomi:${TAG}"
          docker tag capgomi:dev "$image"
          docker run --rm "$image" --help
          make manifests IMG="$image"
          docker save "$image" | gzip > "dist/cluster-api-provider-gomi_${TAG}_linux_amd64.tar.gz"
          cp README.md dist/provider-README.md
          cd dist
          sha256sum infrastructure-components.yaml metadata.yaml cluster-template.yaml provider-README.md cluster-api-provider-gomi_*.tar.gz > provider-checksums.txt
      - name: Upload provider release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: cluster-api-provider
          path: providers/cluster-api/dist/
          if-no-files-found: error
          retention-days: 1
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cluster-api-provider
          path: dist
      - name: Publish provider assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" dist/* --clobber
