---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  labels:
    cluster.x-k8s.io/v1beta2: v1alpha1
  name: gomimachines.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: GomiMachine
    listKind: GomiMachineList
    plural: gomimachines
    singular: gomimachine
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              bareMetal:
                description: BareMetalSpec selects a pool enrolled explicitly through
                  the GOMI API.
                properties:
                  cloudInitConfigRef:
                    description: |-
                      CloudInitConfigRef references declarative, non-secret OS preparation data.
                      GOMI applies it before CABPK's sealed kubeadm bootstrap. The ConfigMap must
                      be immutable so a moved Machine can verify the same provisioning input.
                    properties:
                      key:
                        minLength: 1
                        type: string
                      name:
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  osImageRef:
                    description: |-
                      OSImageRef must be a prepared bare-metal image with cloud-init. Kubernetes
                      node packages may be installed by CloudInitConfigRef.
                    minLength: 1
                    type: string
                  pool:
                    minLength: 1
                    type: string
                required:
                - osImageRef
                - pool
                type: object
                x-kubernetes-validations:
                - message: bareMetal is immutable; replace the Machine instead
                  rule: self == oldSelf
              instanceID:
                description: InstanceID is persisted before provisioning and survives
                  clusterctl move.
                pattern: ^capi-[a-z0-9-]+$
                type: string
                x-kubernetes-validations:
                - message: instanceID is immutable
                  rule: self == oldSelf
              kind:
                default: VirtualMachine
                enum:
                - VirtualMachine
                - BareMetal
                type: string
              providerID:
                type: string
              virtualMachine:
                properties:
                  hypervisorRef:
                    type: string
                  ipAssignment:
                    enum:
                    - dhcp
                    - static
                    type: string
                  network:
                    items:
                      properties:
                        bridge:
                          type: string
                        ipAddress:
                          type: string
                        name:
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  osImageRef:
                    description: |-
                      OSImageRef must reference an image with cloud-init, container runtime,
                      kubelet and kubeadm installed for the requested Kubernetes version.
                    minLength: 1
                    type: string
                  resources:
                    properties:
                      cpuCores:
                        minimum: 1
                        type: integer
                      diskGB:
                        minimum: 1
                        type: integer
                      memoryMB:
                        format: int64
                        minimum: 512
                        type: integer
                    required:
                    - cpuCores
                    - diskGB
                    - memoryMB
                    type: object
                  sshKeyRefs:
                    items:
                      type: string
                    type: array
                  subnetRef:
                    type: string
                required:
                - osImageRef
                - resources
                type: object
                x-kubernetes-validations:
                - message: virtualMachine is immutable; replace the Machine instead
                  rule: self == oldSelf
            type: object
            x-kubernetes-validations:
            - message: instanceID cannot be removed
              rule: '!has(oldSelf.instanceID) || has(self.instanceID)'
            - message: BareMetal requires bareMetal and no virtualMachine
              rule: (self.kind == 'BareMetal') == has(self.bareMetal)
            - message: VirtualMachine requires virtualMachine and no bareMetal
              rule: (self.kind == 'VirtualMachine') == has(self.virtualMachine)
            - message: kind is immutable
              rule: self.kind == oldSelf.kind
          status:
            properties:
              addresses:
                items:
                  properties:
                    address:
                      type: string
                    type:
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              initialization:
                properties:
                  provisioned:
                    type: boolean
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
